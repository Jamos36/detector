# Example pentest date ranges for `annotations:` in the PoC config. PLACEHOLDER VALUES - replace with the real
# engagement dates in the authorised environment (do not commit real engagement details here).
#
# These are weak temporal annotations: broad ranges that contain clean traffic, while testing may also have happened
# outside them. They are drawn on charts and used for descriptive comparisons only; they are never training labels.
#
# start/end: a date (00:00 UTC; a date `end` includes that whole day) or an ISO datetime (without an offset it is
# taken as UTC and marked `assumed_utc` in the manifest; a datetime `end` is exclusive).

intervals:
  - name: example-external-test
    start: 2025-03-10
    end: 2025-03-14
    source: "placeholder - e.g. statement of work reference"
    notes: "placeholder - scope, tester IPs if known"
    confidence: medium          # optional free text: how well the dates are known
  - name: example-internal-test
    start: 2025-10-06T08:00:00Z
    end: 2025-10-10T18:00:00Z
    source: "placeholder"
    notes: "placeholder"
    confidence: low
