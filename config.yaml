# Pipeline configuration. Relative paths are resolved against this file's folder.
# Sized for a CPU-only machine with little free RAM: DuckDB spills to disk
# beyond memory_limit, and Python holds at most `batch_rows` rows at a time.

paths:
  raw: data/raw
  lake: data/lake
  features: data/features
  models: data/models
  outputs: data/outputs
  quarantine: data/quarantine

duckdb:
  memory_limit: 2GB        # raise if more RAM is free; DuckDB spills past this
  threads: 4               # each thread adds working memory
  temp_directory: data/tmp/duckdb

ingest:
  max_reject_fraction: 0.05  # above this share of bad rows, quarantine the whole file

dq:                          # data-quality report (netanomaly dq)
  trailing_days: 7           # daily volume vs median of this many strictly earlier days
  min_history_days: 3
  volume_ratio_low: 0.5      # flag a day below 0.5x / above 2x the trailing median
  volume_ratio_high: 2.0

baseline:                    # host baselines (netanomaly baselines, V2-2)
  lookback_days: 7           # day D is compared with the 7 whole UTC days before it; never day D itself
  min_windows: 30            # a level (host, peer subnet, global) needs >= 30 prior windows ...
  min_days: 2                # ... on >= 2 distinct days, and MAD > 0; otherwise fall back to the next level
  min_peer_hosts: 5          # peer and global levels also need >= 5 distinct hosts

timing:                      # timing regularity (netanomaly timing, V2-4)
  history_hours: 2           # a window starting at W uses flows in [W - 2 h, W); never W itself or later
  min_events: 10             # a (host, destination) series needs >= 10 distinct flow_start instants (9 gaps)

feature_cards:               # per-feature diagnostics (netanomaly feature-cards, V2-5)
  warmup_days: 2             # PSI reference = lake days [2, 2 + reference_days) by position: skips baseline warm-up
  reference_days: 1
  psi_bins: 10               # reference-quantile bins + one NULL bin
  redundancy_threshold: 0.9  # |Spearman rho| >= 0.9 between two features is flagged as redundant

batch_rows: 50000          # rows per Arrow batch when scoring
window_minutes: 5
alert_budget_per_day: 100  # top-K host-windows per day, not a severity threshold

split:                       # time-based train/score split (V3, ADR-022)
  train_fraction: 0.5        # first floor(n_days * 0.5) UTC days train; only later days are scored

model:
  train_sample_rows: 200000  # hash sample of the training days; all of them if fewer
  n_estimators: 200
  max_samples: 256
  seed: 42
  n_jobs: 2
