# Pipeline configuration. Relative paths are resolved against this file's folder.
# Sized for a CPU-only machine with little free RAM: DuckDB spills to disk
# beyond memory_limit, and Python holds at most `batch_rows` rows at a time.

paths:
  raw: data/raw
  lake: data/lake
  features: data/features
  models: data/models
  outputs: data/outputs
  quarantine: data/quarantine

duckdb:
  memory_limit: 2GB        # raise if more RAM is free; DuckDB spills past this
  threads: 4               # each thread adds working memory
  temp_directory: data/tmp/duckdb

batch_rows: 50000          # rows per Arrow batch when scoring
window_minutes: 5
alert_budget_per_day: 100  # top-K host-windows per day, not a severity threshold

model:
  train_sample_rows: 200000
  n_estimators: 200
  max_samples: 256
  seed: 42
  n_jobs: 2
