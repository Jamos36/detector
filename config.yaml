# =====================================================================================================
#  netanomaly settings. Run everything with:   uv run netanomaly        (or double-click run.bat)
#  Afterwards open:  outputs/experiments/<id>/report.html  (the command prints the exact path)
# =====================================================================================================

# ---- 1. MEMORY AND CPU  (the usual things to change) ------------------------------------------------
# How much RAM the run may use, in GB. If it crashes with "out of memory", lower it; if you have more
# free RAM and it is slow, raise it. It sets DuckDB's memory limit (half of it), the size of the model
# training samples and the scoring batch size. (Advanced: any of those can still be set explicitly
# further down; an explicit value always wins.)
memory_gb: 4
threads: 4                       # CPU cores to use

# ---- 2. WHICH DATA ----------------------------------------------------------------------------------
input:
  # Folder(s), file(s) or glob(s) of Parquet files. Two datasets ship with the repo:
  #   data/synth/raw  synthetic, 6 days, 300 hosts, with injected attacks   <- default, best demo
  #   data/raw        mock, 6 days, ~58,000 random IPs (almost no host repeats: weak for per-host models)
  paths: ["data/synth/raw"]
  field_map: {}                  # only needed if your column names differ, e.g.  src_ip: source_address
  epoch_unit: {}                 # only needed if a timestamp column is an integer, e.g.  flow_start: ms
allow_inside_repo: true          # the demo data lives inside this repository (it is mock/synthetic)
work_dir: outputs                # where results go (git-ignored)

# ---- 3. TIME SPLIT  (UTC dates; start inclusive, end exclusive) ---------------------------------------
split:
  train:      {start: 2026-09-01, end: 2026-09-03}   # what "normal" looks like
  validation: {start: 2026-09-03, end: 2026-09-04}   # sets the alert-band cutoffs
  test:       {start: 2026-09-04, end: 2026-09-07}   # the later period being checked
  exclude_annotated_from_train: false

# ---- 4. PENTEST DATE RANGES (context only, never used as labels) ------------------------------------
annotations: annotations.yaml
annotation_buffer_hours: 12      # windows this close to a range count as "uncertain"

# ---- 5. MODEL DETAIL  (fine to leave alone) ----------------------------------------------------------
name: demo                       # prefix of the experiment folder name
window_minutes: 15               # one row per host per 15 minutes (must divide 1440)
features:
  include: null                  # null = all features (see FEATURES.md)
  exclude: []
models:
  seed: 42
  iforest: {n_estimators: 200, max_samples: 256}
  ocsvm: {nu: 0.05, gamma: scale}
bands:                           # review bands: rank buckets, not probabilities or severities
  reference: validation
  mode: quantile                 # or: budget (then set budget_per_day)
  quantiles: {Critical: 0.999, High: 0.995, Medium: 0.99, Low: 0.975}
  budget_per_day: {Critical: 2, High: 10, Medium: 25, Low: 60}
  below_label: Benign            # = below the review threshold, not "proven safe"
diagnostics:
  seed_repeats: 2
  buffer_hours_sensitivity: [0, 12, 48]
report:
  chart_format: svg              # svg or png
search:                          # used only by `uv run netanomaly search`
  iforest: [{n_estimators: 100}, {max_samples: 1024}]
  ocsvm: [{nu: 0.01}, {gamma: 0.1}]
