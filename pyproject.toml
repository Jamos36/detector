[project]
name = "netanomaly"
version = "0.1.0"
description = "NetFlow Parquet anomaly ranking proof of concept: DuckDB + Isolation Forest + One-Class SVM + HTML report"
authors = [
    { name = "Jamos36", email = "ja40maya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "markdown>=3.8",
    "matplotlib>=3.10",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytz>=2026.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[project.scripts]
netanomaly = "netanomaly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
